<!doctype html>
<html lang="en" data-fx-bg="off" style="background:#000">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="BassOrder — from trash playlists to genre mastery. Sort Spotify and local music by genre."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="BassOrder" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>BassOrder — From trash playlists to genre mastery</title>
  </head>

  <body style="margin:0;background:#000;color:#f6f1e8">
    <div id="root">
      <div id="boot-fallback" role="status" aria-live="polite" aria-label="Loading BassOrder">
        <style>
          #boot-fallback {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            margin: 0;
            overflow: hidden;
            background:
              radial-gradient(ellipse 70% 55% at 50% 35%, rgba(125, 255, 212, 0.1), transparent 55%),
              radial-gradient(ellipse 50% 40% at 80% 80%, rgba(138, 180, 255, 0.08), transparent 50%),
              radial-gradient(ellipse 40% 35% at 15% 75%, rgba(228, 195, 145, 0.06), transparent 45%),
              #000;
            font-family: "IBM Plex Sans", system-ui, sans-serif;
            color: #f6f1e8;
            user-select: none;
            pointer-events: none;
          }
          #boot-fallback .boot-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.35rem;
            text-align: center;
            animation: boot-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
          }
          #boot-fallback .boot-mark {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
              0 0 0 1px rgba(125, 255, 212, 0.22),
              0 0 36px rgba(125, 255, 212, 0.18);
          }
          #boot-fallback .boot-mark img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
          }
          #boot-fallback .boot-mark::after {
            content: "";
            position: absolute;
            inset: -20%;
            background: radial-gradient(circle, rgba(125, 255, 212, 0.35), transparent 60%);
            animation: boot-glow 2.4s ease-in-out infinite;
            pointer-events: none;
          }
          #boot-fallback .boot-brand {
            margin: 0;
            font-family: "Syne", system-ui, sans-serif;
            font-size: clamp(1.65rem, 4vw, 2.15rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
          }
          #boot-fallback .boot-brand span {
            background: linear-gradient(120deg, #e4c391, #fff6e8 42%, #7dffd4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
          }
          #boot-fallback .boot-lede {
            margin: 0;
            max-width: 22rem;
            color: #9a9288;
            font-size: 0.92rem;
            letter-spacing: 0.01em;
          }
          #boot-fallback .boot-eq {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            height: 44px;
            margin-top: 0.35rem;
          }
          #boot-fallback .boot-eq i {
            display: block;
            width: 4px;
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(180deg, #7dffd4, #8ab4ff 55%, #e4c391);
            box-shadow: 0 0 10px rgba(125, 255, 212, 0.35);
            transform-origin: bottom;
            animation: boot-bar 1.05s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.07s);
          }
          @keyframes boot-rise {
            from {
              opacity: 0;
              transform: translateY(14px);
            }
            to {
              opacity: 1;
              transform: translateY(0);
            }
          }
          @keyframes boot-glow {
            0%,
            100% {
              opacity: 0.45;
              transform: scale(0.92);
            }
            50% {
              opacity: 1;
              transform: scale(1.08);
            }
          }
          @keyframes boot-bar {
            0%,
            100% {
              transform: scaleY(0.28);
              opacity: 0.55;
            }
            50% {
              transform: scaleY(1);
              opacity: 1;
            }
          }
          @media (prefers-reduced-motion: reduce) {
            #boot-fallback .boot-stage,
            #boot-fallback .boot-mark::after,
            #boot-fallback .boot-eq i {
              animation: none;
            }
            #boot-fallback .boot-eq i {
              transform: scaleY(0.55);
              opacity: 0.8;
            }
          }
        </style>
        <div class="boot-stage">
          <div class="boot-mark">
            <img src="/logo.svg" alt="" width="72" height="72" />
          </div>
          <p class="boot-brand"><span>BassOrder</span></p>
          <p class="boot-lede">From trash playlists to genre mastery</p>
          <div class="boot-eq" aria-hidden="true">
            <i style="--i:0"></i>
            <i style="--i:1"></i>
            <i style="--i:2"></i>
            <i style="--i:3"></i>
            <i style="--i:4"></i>
            <i style="--i:5"></i>
            <i style="--i:6"></i>
            <i style="--i:7"></i>
            <i style="--i:8"></i>
            <i style="--i:9"></i>
            <i style="--i:10"></i>
            <i style="--i:11"></i>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
