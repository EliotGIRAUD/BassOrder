# Zones rate-limit BassOrder — à placer dans /etc/nginx/conf.d/
# (http context). Ne touche pas aux autres sites.

limit_req_zone $binary_remote_addr zone=bassorder_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=bassorder_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bassorder_knowledge:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=bassorder_conn:10m;
