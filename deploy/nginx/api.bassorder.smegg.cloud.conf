# API reverse-proxy — api.bassorder.smegg.cloud
# Après Certbot : conserver listen 443 ssl + chemins Let's Encrypt.
# Sécurité : include snippets + rate-limit /auth (voir conf.d/bassorder-rate-limit.conf)

server {
    listen 80;
    listen [::]:80;
    server_name api.bassorder.smegg.cloud;

    # Certbot remplace souvent ce bloc par un redirect 301 HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /auth/ {
        limit_req zone=bassorder_auth burst=10 nodelay;
        limit_conn bassorder_conn 20;
        include /etc/nginx/snippets/bassorder-api-proxy.conf;
        include /etc/nginx/snippets/bassorder-security-headers.conf;
        proxy_pass http://127.0.0.1:8787;
    }

    location / {
        limit_req zone=bassorder_api burst=60 nodelay;
        limit_conn bassorder_conn 40;
        include /etc/nginx/snippets/bassorder-api-proxy.conf;
        include /etc/nginx/snippets/bassorder-security-headers.conf;
        proxy_pass http://127.0.0.1:8787;
    }
}
