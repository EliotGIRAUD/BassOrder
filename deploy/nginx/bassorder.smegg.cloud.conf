# Landing + téléchargements — bassorder.smegg.cloud
# Après Certbot : conserver listen 443 ssl + chemins Let's Encrypt.

server {
    listen 80;
    listen [::]:80;
    server_name bassorder.smegg.cloud;

    root /var/www/bassorder;
    index index.html;
    charset utf-8;
    charset_types text/html text/css application/javascript application/json text/plain;

    include /etc/nginx/snippets/bassorder-security-headers.conf;

    # CSP landing : script externe + polices Google + audio /clips
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; media-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /clips/ {
        alias /var/www/bassorder/clips/;
        types {
            audio/mpeg mp3;
            audio/mp4 m4a;
            audio/ogg ogg;
            audio/wav wav;
            application/json json;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        autoindex off;
    }

    location /downloads/ {
        alias /var/www/bassorder/downloads/;
        add_header Content-Disposition 'attachment';
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/octet-stream msi exe;
        }
        # Pas de listing de répertoire
        autoindex off;
    }
}
