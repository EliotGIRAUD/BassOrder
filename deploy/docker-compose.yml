# Déploiement VPS — API + volume SQLite
# Usage (sur le serveur) :
#   cd /opt/bassorder && docker compose -f deploy/docker-compose.yml up -d --build
#
# Prérequis : fichier /opt/bassorder/deploy/.env (non versionné) avec BASSORDER_JWT_SECRET

services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: bassorder-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BASSORDER_API_ADDR: "0.0.0.0:8787"
      BASSORDER_DB: /data/bassorder.db
      BASSORDER_PUBLIC_BASE: https://api.bassorder.smegg.cloud
      BASSORDER_CORS_ORIGINS: "tauri://localhost,https://tauri.localhost,http://tauri.localhost,https://bassorder.smegg.cloud"
    volumes:
      - bassorder_data:/data
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bassorder_data:
